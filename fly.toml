app = "checkmyog"
primary_region = "sjc"

[build]

[env]
  PUBLIC_URL = "https://checkmyog.com"
  POSTHOG_HOST = "https://us.i.posthog.com"
  # POSTHOG_KEY is the public phc_ project key, set as a Fly secret so forks don't inherit it.
  COUNTER_PATH = "/data/checks"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  # Off: the app redirects http to https itself (server.py _https_redirect), except for the
  # long test domain, which arrives over plain http from Cloudflare's proxy.
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
