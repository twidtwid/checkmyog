name: Bug
description: The checker gives a wrong result, errors, or the page breaks
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: URL you checked
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Markdown report
      description: "Output of https://checkmyog.com/api/inspect?url=<your url>&format=md"
      render: markdown
  - type: input
    id: browser
    attributes:
      label: Browser and device (for page problems)
  - type: dropdown
    id: agent
    attributes:
      label: Filed by
      options: ["A person", "An AI agent (name it below)"]
