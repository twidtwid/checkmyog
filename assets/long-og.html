<div class="foot">63 characters before the dot, the most the DNS allows, and 13 after it. Every og tag on this page is correct, so if your app choked, it was the length.</div>
<div class="site">checkmyog.com</div>
<script>
const LABEL = 'thisisaridiculouslylongdomainnamemadeonlytotestyourlinkpreviews', TLD = '.international';
const FULL = LABEL + TLD, N = FULL.length;
const ease = (x) => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const WORDS = ['thisisa', 'ridiculously', 'long', 'domain', 'name', 'made', 'only', 'to', 'test', 'your', 'link', 'previews'];
console.assert(WORDS.join('') === LABEL);
// A prefix of the label with <wbr> at the word boundaries, so lines break where a reader would, as on the page.
function html(s) {
  let out = '', i = 0;
  for (const w of WORDS) { if (i >= s.length) break; out += s.slice(i, i + w.length); i += w.length; if (i < s.length) out += '<wbr>'; }
  return out;
}
function show(n, cursor) {
  const s = FULL.slice(0, n);
  document.getElementById('label').innerHTML = html(s.slice(0, LABEL.length));
  document.getElementById('tld').textContent = s.slice(LABEL.length);
  document.getElementById('cur').style.visibility = cursor ? 'visible' : 'hidden';
}
// t in seconds, 0..6: full (0-0.8), delete (0.8-2.3), empty (2.3-2.6), type (2.6-5.4), full (5.4-6).
window.setFrame = (t) => {
  if (t < 0.8 || t >= 5.4) return show(N, false);
  if (t < 2.3) return show(Math.round(N * (1 - ease((t - 0.8) / 1.5))), true);
  if (t < 2.6) return show(0, Math.floor(t * 6) % 2 === 0);
  return show(Math.round(N * ease((t - 2.6) / 2.8)), true);
};
window.setFrame(0);
</script>
