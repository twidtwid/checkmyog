<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700&family=Schibsted+Grotesk:wght@400;500;600&display=block" rel="stylesheet">
<style>
html,body{margin:0}
body{width:1200px;height:630px;background:#15171a;color:#e6e8eb;font-family:"Schibsted Grotesk",sans-serif;position:relative;overflow:hidden}
.wrap{position:absolute;left:80px;top:78px;right:80px}

p{font-size:34px;line-height:1.35;color:#a2a8b2;margin:0;max-width:900px}
.rows{position:absolute;left:80px;bottom:150px;display:flex;gap:14px;font:500 24px "Schibsted Grotesk";}
.chip{white-space:nowrap;border:1px solid #363b42;border-radius:6px;padding:8px 14px;color:#c9cdd3}
.chip b{color:#5ccf86;font-weight:600;margin-right:8px}
.chip.n b{color:#a2a8b2}
